name: Release gate tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: pytest -q
      - name: Verify checked-in decision evidence
        run: |
          python gate.py scenarios.json --output /tmp/results.json || test $? -eq 1
          diff -u results.json /tmp/results.json
